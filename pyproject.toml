[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-here"
version = "0.1.0"
description = "Reproducible, source-only US county comparisons"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
live-here = "live_here.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
